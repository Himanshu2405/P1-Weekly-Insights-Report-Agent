[project]
name = "weekly-report"
version = "0.1.0"
description = "Automated weekly business report with guarded, evaluated AI commentary"
requires-python = ">=3.12"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
weekly_report = ["sql/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
