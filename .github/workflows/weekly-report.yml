name: Weekly Report

on:
  schedule:
    # GitHub Actions cron is UTC-only with no daylight-saving support, so two triggers bracket
    # 8am America/New_York across EDT (UTC-4) and EST (UTC-5). should_run_now.py lets only the
    # one that actually lands on 8am ET proceed; the other is a no-op (see weekly_report.schedule).
    - cron: "0 12 * * 1"
    - cron: "0 13 * * 1"
  workflow_dispatch:
    inputs:
      force:
        description: "Run now, ignoring the 8am ET schedule guard"
        type: boolean
        default: true

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e .
      - id: check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force }}" = "true" ]; then
            echo "manual run, forced" && echo "proceed=true" >> "$GITHUB_OUTPUT"
          elif python scripts/should_run_now.py; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          fi

  build-and-publish:
    needs: guard
    if: needs.guard.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -e .

      - name: Guards and evals must pass before publishing
        run: pytest -v

      - name: Authenticate to GCP (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Build the report
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/build_report.py

      - name: Commit the run log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add runs/run_log.jsonl
          git diff --cached --quiet || git commit -m "Log scheduled run $(date -u +%F)"
          git push

      - name: Include the architecture diagram in the published site
        run: cp docs/architecture.html site/architecture.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Post status comment (scheduled runs only, not manual)
        if: always() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: python scripts/notify_status.py

  alert-on-failure:
    needs: [guard, build-and-publish]
    if: failure() && needs.guard.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --repo "${{ github.repository }}" \
            --title "Weekly report run failed: $(date -u +%F)" \
            --body "The scheduled weekly report workflow failed. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
